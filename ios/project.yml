# XcodeGen spec for Zen for iOS (ticket #0087F).
#   brew install xcodegen && cd ios && xcodegen generate && open Zen.xcodeproj
#
# Zen on iOS cannot ship Gecko (Apple requires WebKit outside the EU, and Gecko
# has no iOS target). This app reproduces Zen's *UX* — spaces, vertical tabs,
# essentials, glance, split view, compact mode — on top of WKWebView.
#
# Zero external dependencies: SwiftUI + WebKit + Foundation only.
name: Zen

options:
  bundleIdPrefix: com.morton
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Andy's free PERSONAL team (Apple ID andrew.haynes@me.com). Personal-team
    # caveats: on-device profiles expire after 7 days, max 3 sideloaded apps.
    # Simulator builds pass CODE_SIGNING_ALLOWED=NO and ignore this entirely.
    DEVELOPMENT_TEAM: XXVMGZB67S
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Zen:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morton.zen
        PRODUCT_NAME: Zen
        INFOPLIST_FILE: Sources/App/Info.plist
        # The keychain needs an entitlement even in a simulator: without one
        # every SecItem call returns -34018 and both the sync keys and the
        # vault credentials have nowhere to live (#008AD). Note that a build
        # passing CODE_SIGNING_ALLOWED=NO embeds no entitlements at all, so
        # the keychain is unavailable in one — see "Passwords" in README.md.
        CODE_SIGN_ENTITLEMENTS: Sources/App/Zen.entitlements
        # We ship an explicit Info.plist, so Xcode does NOT inject the standard
        # CFBundle* keys — the plist declares them itself or install fails with
        # "Missing bundle ID".
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SUPPORTS_MACCATALYST: NO

  # Drives the app through each state and writes PNGs into the runner's
  # Documents directory, which `xcrun simctl get_app_container` can then pull
  # out to ios/docs/screenshots. Not part of the default test action — it needs
  # the network and takes much longer than the unit tests.
  ZenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ZenUITests
    dependencies:
      - target: Zen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morton.zen.uitests
        TEST_TARGET_NAME: Zen
        GENERATE_INFOPLIST_FILE: YES

  ZenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ZenTests
      # A folder reference, not a flattened resource group: the fixtures are
      # nested by subject (forms/, onepassword-connect/) and two subjects would
      # otherwise be free to collide on a file name inside the bundle.
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Zen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morton.zen.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Zen:
    build:
      targets:
        Zen: all
        ZenTests: [test]
        ZenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZenTests

  ZenScreenshots:
    build:
      targets:
        Zen: all
        ZenUITests: [test]
    test:
      config: Debug
      targets:
        - ZenUITests
